name: generate animation and stats

on:
  schedule:
    # Скрипт будет гарантированно запускаться каждый день в 00:00 UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:

  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      # Создаем папку внутри репозитория, куда запишем картинки
      - name: Create local assets folder
        run: mkdir -p assets

      # Скачиваем статистику прямо в папку assets вашего репозитория
      - name: generate github-stats.svg
        run: |
          curl -o assets/github-stats.svg "https://vercel.app"

      # Генерируем змейку прямо в папку assets вашего репозитория
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mintermonde
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Автоматически пушим изменения в ваш репозиторий от имени робота
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/
          git commit -m "Update profile stats and snake animation" || echo "No changes to commit"
          git push origin main
