name: generate animation and stats

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Шаг 1: Скачиваем репозиторий
      - name: Checkout repo
        uses: actions/checkout@v3

      # Шаг 2: Генерируем карточку статистики и сохраняем локально как файл github-stats.svg
      - name: generate github-stats.svg
        run: |
          mkdir -p dist
          curl -o dist/github-stats.svg "https://vercel.app"

      # Шаг 3: Генерируем змейку
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mintermonde
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Шаг 4: Пушим все сгенерированные файлы (и змейку, и статистику) в ветку output
      - name: push files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
