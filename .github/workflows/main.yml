name: generate animation and stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Create local assets folder
        run: mkdir -p assets

      # НАДЕЖНЫЙ ГЕНЕРАТОР СТАТИСТИКИ (Metrics)
      - name: GitHub Metrics Action
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          filename: assets/github-stats.svg
          base: header, activity, community, repositories
          config_timezone: Europe/Kaliningrad
          plugin_languages: yes
          plugin_languages_ignored: html, css

      # ГЕНЕРАТОР ЗМЕЙКИ
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Mintermonde
          outputs: |
            assets/github-contribution-grid-snake.svg
            assets/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/
          git commit -m "Update profile stats and snake animation" || echo "No changes to commit"
          git push origin main
